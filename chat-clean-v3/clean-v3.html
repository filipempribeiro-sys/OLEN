ions"><button id="olenChatSearchBtn" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button><button class="olen-side-collapse" id="olenSideCollapse" aria-label="Recolher barra lateral"><span><i></i><i></i></span></button></div></div><div class="olen-side-scroll"><button class="olen-side-new" id="olenSideNew" data-rail-tip="Novo chat"><span><svg viewBox="0 0 24 24"><path d="M13.5 5.5 18.5 10.5"/><path d="M4 20l4.1-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/><path d="M13 6H6a2 2 0 0 0-2 2v10"/></svg></span> Nova conversa</button><div class="olen-side-tools"><button data-rail-tip="Imagens"><span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg></span> Imagens</button><button data-rail-tip="Biblioteca"><span><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"/><path d="M8 4v16"/><path d="M12 8h4"/></svg></span> Biblioteca</button><button data-rail-tip="Projetos / Planos"><span><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></span> Projetos / Planos</button><button data-rail-tip="Agendados"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg></span> Agendados</button></div><div id="olenSideSections"></div></div><nav data-compare="mainnav" class="olen-side-mainnav" aria-label="Navegação principal do Chat"><button data-view="home" data-rail-tip="Início"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3Z"/></svg><span>Início</span></button><button data-view="map" data-rail-tip="Mapa"><svg viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15m6-12v15"/></svg><span>Mapa</span></button><button class="active" data-view="chat" data-rail-tip="Chat"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4Z"/></svg><span>Chat</span></button><button data-view="agenda" data-rail-tip="Agenda"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></svg><span>Agenda</span></button><button data-view="profile" data-rail-tip="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 3.6-7 8-7s7 2.5 8 7"/></svg><span>Perfil</span></button></nav></aside><div class="olen-chat-search-pop" id="olenChatSearchPop" hidden><div class="olen-search-head"><button id="olenSearchBack" aria-label="Voltar"><span class="olen-dir left" aria-hidden="true"></span></button><input id="olenSearchInput" placeholder="Pesquisar conversas" aria-label="Pesquisar conversas"></div><p>Pesquisa em todas as conversas</p><div class="olen-search-results" id="olenSearchResults"><div class="olen-search-hint">Escreve uma palavra ou frase para pesquisar.</div></div></div><div class="olen-chat-more" id="olenChatMore" hidden><button data-chat-more="share">Partilhar conversa</button><button data-chat-more="conversations">Conversas</button><button data-chat-more="home">Início</button></div><div class="olen-long-scrim" id="olenLongScrim" hidden></div><div class="olen-long-menu" id="olenLongMenu" hidden><button data-long="pin">Fixar</button><button data-long="rename">Renomear</button><button class="danger" data-long="delete">Eliminar</button></div></section><script src="./clean-v3.js"></script></body></html>
