function load(){try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a)&&a.length)return a}catch(e){}let a=[{id:'demo-sintra',title:'Sintra · Trail',pinned:false,updated:Date.now(),messages:[{role:'assistant',text:'Olá Filipe. O que queres fazer hoje?'},{role:'user',text:'Quero um trail em Sintra, com saída da Amadora de comboio. Quero monumentos, um sítio para almoçar e, se der, terminar perto da praia.'},{role:'assistant',text:'Tenho uma proposta para um dia completo: chegada a Sintra de manhã, percurso pedonal pela vila e encosta, passagem por pontos históricos e continuação até uma zona com ligação à costa. Vou organizar tudo por etapas para conseguires testar uma resposta longa.'},{role:'assistant',kind:'card',title:'1 · Chegada a Sintra',text:'Comboio até Sintra · início do percurso junto à estação. A partir daqui, a experiência segue a pé pelo centro histórico.'},{role:'assistant',kind:'card',title:'2 · Centro histórico',text:'Percurso pela vila, com tempo para explorar ruas, miradouros e património antes de subir para a zona de Seteais.'},{role:'user',text:'Quero privilegiar locais gratuitos e evitar andar sempre a correr.'},{role:'assistant',text:'Perfeito. Ajusto o ritmo: menos paragens obrigatórias, mais tempo em cada local e prioridade a espaços exteriores ou gratuitos. Os locais pagos ficam apenas como alternativas.'},{role:'assistant',kind:'card',title:'3 · Seteais e encosta',text:'Subida progressiva pela zona de Seteais, com paragens para descanso e fotografia. O percurso pode ser encurtado se o ritmo estiver abaixo do previsto.'},{role:'assistant',kind:'card',title:'4 · Almoço',text:'Paragem prevista a meio da experiência. A OLEN poderá apresentar aqui opções próximas, preço estimado, distância e possibilidade de guardar a escolha.'},{role:'user',text:'E depois do almoço ainda conseguimos ir à praia?'},{role:'assistant',text:'Sim. Mantendo este ritmo, a segunda metade pode orientar-se para a costa. Em dados reais, esta decisão seria function section(title,items,limit,moreBtn){if(!items.length)return'';return '<div class="olen-side-section"><div class="olen-side-title"><span>'+title+'</span></div>'+items.slice(0,limit).map(x=>'<div class="olen-conv-row'+(x.id===activeId()?' active':'')+'"><button class="olen-conv'+(x.id===activeId()?' active':'')+'" data-conv="'+esc(x.id)+'">'+esc(x.title)+'</button><button class="olen-conv-more" data-conv-more="'+esc(x.id)+'" aria-label="Opções da conversa" title="Opções">⋮</button></div>').join('')+(moreBtn&&items.length>limit?'<button class="olen-side-more" id="olenRecentAll">Ver todas</button>':'')+'</div>'}
function renderSide(){if(!sections)return;let a=load(),pinned=a.filter(x=>x.pinned).sort((x,y)=>y.updated-x.updated),recent=a.filter(x=>!x.pinned).sort((x,y)=>y.updated-x.updated);sections.innerHTML=section('Afixados',pinned,10,false)+section('Recentes',recent,5,true)+(a.length?'':'<div class="olen-side-empty">Sem conversas.</div>');bindConvs();$('olenRecentAll')?.addEventListener('click',()=>openSearch('',true))}
function bindConvs(){document.querySelectorAll('.olen-conv').forEach(b=>{b.onclick=()=>setActive(b.dataset.conv);const start=e=>{if(e.pointerType==='mouse')return;clearTimeout(timer);timer=setTimeout(()=>openLong(b.dataset.conv),500)},cancel=()=>clearTimeout(timer);b.onpointerdown=start;b.onpointerup=cancel;b.onpointercancel=cancel;b.onpointerleave=cancel});document.querySelectorAll('[data-conv-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();openLong(b.dataset.convMore)})}
msgs?.addEventListener('click',e=>{let b=e.target.closest('[data-msg-action]');if(!b)return;let turn=b.closest('.olen-msg-actions'),i=Number(turn?.dataset.msgIndex),a=load(),x=a.find(v=>v.id===activeId()),m=x?.messages?.[i];if(!m)return;let act=b.dataset.msgAction;if(act==='copy')navigator.clipboard?.writeText(m.text);if(act==='up'||act==='down'){turn.querySelectorAll('[data-msg-action="up"],[data-msg-action="down"]').forEach(z=>z.classList.remove('active'));b.classList.add('active')}if(act==='share'){if(navigator.share)navigator.share({title:x.title||'OLEN',text:m.text}).catch(()=>{});else navigator.clipboard?.writeText(m.text)}if(act==='retry'){x.messages.splice(i+1);x.messages.push({role:'assistant',text:'A OLEN irá gerar aqui uma nova resposta quando ligarmos o Conversation Engine.'});x.updated=Date.now();save(a);renderChat()}if(act==='more')alert('Mais ações da resposta serão ligadas ao motor OLEN.')});
function syncSideLayout(){let chat=document.querySelector('.screen[data-screen="chat"]');if(!chat||!side)return;let expanded=innerWidth>=700&&side.classList.contains('show');chat.classList.toggle('side-expanded',expanded);let t=$('olenRailToggle');if(t)t.dataset.railTip=expanded?'Fechar barra lateral':'Abrir barra lateral'}function openSide(){side?.classList.add('show');side?.setAttribute('aria-hidden','false');if(innerWidth<700)scrim?.classList.add('show');syncSideLayout();renderSide()}function closeSide(){side?.classList.remove('show');side?.setAttribute('aria-hidden','true');scrim?.classList.remove('show');syncSideLayout()}function toggleSide(){side?.classList.contains('show')?closeSide():openSide()}

function syncComposerAction(){let action=$('olenChatAction'),mic=$('olenChatMic');if(!action||!mic)return;let generating=action.dataset.mode==='stop',hasText=!!input?.value.trim(),img=action.querySelector('img');if(generating){mic.hidden=true;action.dataset.mode='stop';if(img){img.hidden=false;img.src='./assets/olen-stop-icon.png'}action.setAttribute('aria-label','Parar resposta');return}if(hasText){mic.hidden=true;action.dataset.mode='send';if(img){img.hidden=false;img.src='./assets/olen-send-msg-icon.png'}action.setAttribute('aria-label','Enviar mensagem')}else{mic.hidden=false;action.dataset.mode='voice';if(img)img.hidden=true;action.setAttribute('aria-label','Iniciar voz')}}function setComposerGenerating(on){let action=$('olenChatAction'),img=action?.querySelector('img');if(!action)return;if(on){action.dataset.mode='stop';if(img){img.hidden=false;img.src='./assets/olen-stop-icon.png'}$('olenChatMic').hidden=true;action.setAttribute('aria-label','Parar resposta')}else{action.dataset.mode='voice';if(img)img.hidden=true;syncComposerAction()}}function resizeComposer(){if(!input)return;input.style.height='auto';input.style.height=Math.min(input.scrollHeight,132)+'px';input.style.overflowY=input.scrollHeight>132?'auto':'hidden';syncComposerAction()}function send(){let v=input?.value.trim();if(!v)return;let a=load(),x=a.find(z=>z.id===activeId());if(!x)return;x.messages.push({role:'user',text:v});if(x.title==='Nova conversa')x.title=v.slice(0,42);x.updated=Date.now();input.value='';resizeComposer();save(a);renderChat()}
function openLong(id){longId=id;let x=load().find(v=>v.id===id);let pin=longMenu?.querySelector('[data-long="pin"]');if(pin){pin.textContent=x?.pinned?'Desafixar':'Fixar';pin.disabled=!x?.pinned&&load().filter(v=>v.pinned).length>=10}longScrim.hidden=false;longMenu.hidden=false;requestAnimationFrame(()=>longScrim.classList.add('show'))}function closeLong(){longScrim?.classList.remove('show');longMenu.hidden=true;setTimeout(()=>longScrim.hidden=true,180);longId=null}
function openSearch(q='',all=false){closeSide();let pop=$('olenChatSearchPop'),inp=$('olenSearchInput');if(!pop)return;pop.hidden=false;inp.value=q;renderSearch(q,all);setTimeout(()=>inp.focus(),40)}function closeSearch(){$('olenChatSearchPop').hidden=true}function renderSearch(q,all=false){let out=$('olenSearchResults'),a=load(),s=q.trim().toLowerCase();if(!s&&!all){out.innerHTML='<div class="olen-search-hint">Escreve uma palavra ou frase para pesquisar.</div>';return}let r=all?a:a.filter(x=>x.title.toLowerCase().includes(s)||x.messages.some(m=>m.text.toLowerCase().includes(s)));out.innerHTML=r.length?r.sort((x,y)=>y.updated-x.updated).map(x=>'<button class="olen-search-result" data-search-conv="'+esc(x.id)+'"><b>'+esc(x.title)+'</b><small>'+esc(x.messages[x.messages.length-1]?.text||'')+'</small></button>').join(''):'<div class="olen-search-hint">Nenhuma conversa encontrada.</div>';out.querySelectorAll('[data-search-conv]').forEach(b=>b.onclick=()=>{closeSearch();setActive(b.dataset.searchConv)})}
