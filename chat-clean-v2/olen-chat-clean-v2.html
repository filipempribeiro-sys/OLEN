<section class="oc-chat" id="ocChat" data-clean-chat-v2 hidden>
<header class="oc-head"><button class="oc-menu" id="ocMenu" aria-label="Abrir barra lateral"><img src="./assets/olen-sidebar-icon.png" alt="OLEN"></button><div class="oc-head-actions"><button id="ocNew" aria-label="Nova conversa"><svg viewBox="0 0 24 24"><path d="M13.5 5.5 18.5 10.5"/><path d="M4 20l4.1-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/><path d="M13 6H6a2 2 0 0 0-2 2v10"/></svg></button><button id="ocMoreBtn" aria-label="Mais opções">⋮</button></div></header>
<main class="oc-body"><div class="oc-stream" id="ocStream"></div><div class="oc-useful" id="ocUseful" hidden><span>Esta conversa está a ser útil?</span><button data-useful="up" aria-label="Sim">👍</button><button data-useful="down" aria-label="Não">👎</button><button data-useful="close" aria-label="Fechar">×</button></div><div class="oc-composer-wrap"><div class="oc-composer"><button class="oc-plus" id="ocAttach" aria-label="Anexar ficheiros">+</button><input id="ocFile" type="file" multiple accept="image/*,.pdf,.txt,.md,.doc,.docx" hidden><div class="oc-files" id="ocFiles" hidden></div><textarea id="ocInput" rows="1" placeholder="Fala com a OLEN…"></textarea><button class="oc-tone" id="ocTone">Equilibrado⌄</button><div class="oc-tone-menu" id="ocToneMenu" hidden><button data-tone="balanced">Equilibrado</button><button data-tone="direct">Direto</button><button data-tone="explore">Explorar</button></div><button class="oc-mic" id="ocMic" aria-label="Ditado"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></svg></button><button class="oc-action" id="ocAction" data-mode="voice" aria-label="Iniciar voz"><span class="oc-voice"><i></i><i></i><i></i></span><img alt="" hidden></button></div><div class="oc-status" id="ocStatus" data-state="idle" role="status" aria-live="polite" hidden></div><div class="oc-disclaimer">A OLEN pode cometer erros. Confirma informações importantes antes de partir.</div></div></main>
<div class="oc-scrim" id="ocScrim" hidden></div>
<aside class="oc-sidebar" id="ocSidebar" aria-hidden="true">
 <div class="oc-side-head"><button class="oc-rail-toggle" id="ocRail" data-rail-tip="Abrir barra lateral" aria-label="Expandir ou recolher sidebar"><img class="oc-rail-brand" src="./assets/olen-sidebar-icon.png" alt="OLEN"><span class="oc-collapse-glyph" aria-hidden="true"><i></i><i></i></span></button><img class="wordmark" src="./assets/olen-wordmark.png" alt="OLEN"><div class="oc-side-head-actions"><button id="ocSearchBtn" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button><button class="oc-side-collapse" id="ocSideCollapse" aria-label="Recolher barra lateral"><span><i></i><i></i></span></button></div></div>
 <div class="oc-side-scroll"><button class="oc-side-new" id="ocSideNew" data-rail-tip="Novo chat"><span><svg viewBox="0 0 24 24"><path d="M13.5 5.5 18.5 10.5"/><path d="M4 20l4.1-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/><path d="M13 6H6a2 2 0 0 0-2 2v10"/></svg></span><span class="oc-side-new-label">Nova conversa</span></button>
 <div class="oc-side-tools"><button data-tool="images" data-rail-tip="Imagens"><span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg></span><span class="oc-label">Imagens</span></button><button data-tool="library" data-rail-tip="Biblioteca"><span><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"/><path d="M8 4v16"/><path d="M12 8h4"/></svg></span><span class="oc-label">Biblioteca</span></button><button data-tool="plans" data-rail-tip="Projetos / Planos"><span><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></span><span class="oc-label">Projetos / Planos</span></button><button data-tool="scheduled" data-rail-tip="Agendados"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg></span><span class="oc-label">Agendados</span></button></div><div class="oc-sections" id="ocSections"></div></div>
 <nav class="oc-mainnav" id="ocMainNav" aria-label="Navegação principal do Chat"><button data-view="home" data-rail-tip="Início"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3Z"/></svg><span class="oc-label">Início</span></button><button data-view="map" data-rail-tip="Mapa"><svg viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15m6-12v15"/></svg><span class="oc-label">Mapa</span></button><button class="active" data-view="chat" data-rail-tip="Chat"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4Z"/></svg><span class="oc-label">Chat</span></button><button data-view="agenda" data-rail-tip="Agenda"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></svg><span class="oc-label">Agenda</span></button><button data-view="profile" data-rail-tip="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 3.6-7 8-7s7 2.5 8 7"/></svg><span class="oc-label">Perfil</span></button></nav>
</aside>
<div class="oc-search" id="ocSearch" hidden><div class="oc-search-head"><button id="ocSearchBack" aria-label="Voltar">←</button><input id="ocSearchInput" placeholder="Pesquisar conversas" aria-label="Pesquisar conversas"></div><p>Pesquisa em todas as conversas</p><div id="ocSearchResults"></div></div>
<div class="oc-long-scrim" id="ocLongScrim" hidden></div><div class="oc-long" id="ocLong" hidden><button data-long="pin">Fixar</button><button data-long="rename">Renomear</button><button class="danger" data-long="delete">Eliminar</button></div>
<div class="oc-more" id="ocMore" hidden><button data-more="share">Partilhar conversa</button><button data-more="conversations">Conversas</button><button data-more="home">Início</button></div>
<div class="oc-message-more" id="ocMessageMore" hidden><button data-message-more="copy">Copiar resposta</button><button data-message-more="share">Partilhar resposta</button><button data-message-more="retry">Gerar novamente</button></div>
</section>
