<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OLEN Chat Clean V2</title><style>html,body{margin:0;min-height:100%;background:#06130f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style><style>:root{--oc-rail:72px;--oc-panel:340px;--oc-bg:#06130f;--oc-surface:#10271f;--oc-line:rgba(82,246,220,.18);--oc-text:#eef7f4;--oc-muted:#91a19c;--oc-safe:env(safe-area-inset-bottom,0px)}

.oc-chat button,.oc-chat input,.oc-chat textarea{font:inherit}.oc-chat button{cursor:pointer}.oc-chat svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.oc-user-turn{align-self:stretch;display:flex;justify-content:flex-end;min-width:0}.oc-turn{align-self:flex-start;max-width:86%;display:flex;flex-direction:column;gap:4px}.oc-bubble{max-width:86%;padding:13px 15px;border:1px solid rgba(91,168,255,.42);background:rgba(4,22,19,.2);border-radius:18px 18px 18px 6px;white-space:pre-wrap;overflow-wrap:anywhere}.oc-user-turn .oc-bubble{margin-left:auto;border-color:rgba(82,246,220,.52);background:rgba(82,246,220,.055);border-radius:18px 18px 6px 18px}
.oc-msg-actions{height:34px;display:flex;gap:2px}.oc-msg-actions button{width:34px;height:34px;border:0;background:transparent;color:#9eaaa6;display:grid;place-items:center}.oc-msg-actions button.active{color:#63ddb1;background:rgba(99,221,177,.08);border-radius:50%}
.oc-card{border:1px solid rgba(91,168,255,.3);border-radius:18px;padding:15px;background:rgba(5,23,20,.25)}.oc-card small,.oc-card b{display:block}.oc-card b{margin:4px 0}.oc-card p{margin:6px 0 10px}.oc-card button{border:1px solid #ffffff18;background:transparent;color:inherit;border-radius:12px;padding:8px 10px;margin-right:6px}
.oc-compose-zone{position:fixed;z-index:120;left:10px;right:10px;bottom:calc(90px + var(--oc-safe))}.oc-composer{min-height:54px;display:flex;align-items:center;gap:4px;padding:5px 7px;border:1px solid var(--oc-line);border-radius:28px;background:var(--oc-surface);box-sizing:border-box}.oc-composer textarea{flex:1;min-width:0;min-height:42px;max-height:132px;padding:10px 6px;border:0;outline:0;resize:none;background:transparent;color:inherit;line-height:21px}.oc-tone{height:34px;border:0;background:transparent;color:#aebdb8}.oc-action{width:38px;height:38px;flex:0 0 38px;border:0;background:transparent;display:grid;place-items:center}.oc-action img{width:38px;height:38px}.oc-voice{width:36px;height:36px;border:2px solid #45e7da;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:2px}.oc-voice i{width:2px;background:linear-gradient(#58f5e6,#b16cff);border-radius:2px}.oc-voice i:nth-child(1){height:10px}.oc-voice i:nth-child(2){height:17px}.oc-voice i:nth-child(3){height:12px}
.oc-files{position:absolute;left:10px;right:10px;bottom:62px;display:flex;gap:6px;overflow:auto}.oc-file{flex:0 0 auto;max-width:190px;padding:7px 9px;border:1px solid #ffffff18;border-radius:13px;background:#0b2119;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oc-file button{border:0;background:transparent;color:inherit}.oc-status,.oc-disclaimer{text-align:center;margin:4px 10px 0}.oc-status{font-size:11px;color:#aebdb8}.oc-status[data-state="generating"]{color:#63ddb1}.oc-status[data-state="error"]{color:#ff9aa1}.oc-status[data-state="stopped"]{color:#c5d2ce}.oc-disclaimer{font-size:10px;color:#81918c}
.oc-scrim{position:fixed;inset:0;z-index:180;background:#020a0db8;backdrop-filter:blur(3px)}.oc-sidebar{position:fixed;z-index:200;inset:0 auto 0 0;width:min(86vw,360px);padding:max(12px,env(safe-area-inset-top)) 16px calc(12px + var(--oc-safe));background:linear-gradient(180deg,#071b15,#06130f);border-right:1px solid #ffffff12;display:flex;flex-direction:column;box-sizing:border-box}.oc-side-head{height:56px;display:flex;align-items:center;gap:8px}.oc-wordmark{width:96px;margin-right:auto}.oc-side-actions{display:flex}.oc-side-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:none}.oc-side-row{width:100%;height:46px;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:11px;padding:0 12px;text-align:left}.oc-side-row svg{flex:0 0 20px}.oc-side-row b{font-weight:500}.oc-side-new{border:1px solid #ffffff12;border-radius:16px;background:var(--oc-surface);margin:5px 0 10px}.oc-tools{margin-bottom:10px}
.oc-section{margin:12px 0}.oc-section-title{padding:0 7px 5px;color:#63ddb1;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.oc-conv-row{display:flex;align-items:center}.oc-conv{flex:1;min-width:0;border:0;background:transparent;color:inherit;text-align:left;padding:10px 9px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oc-conv.active{background:#123126}.oc-conv-more{width:36px;height:36px;border:0;background:transparent;color:inherit}.oc-side-more{border:0;background:transparent;color:#63ddb1;padding:8px 9px}
.oc-nav{display:flex;flex-direction:column;margin-top:auto}.oc-nav button{height:44px;border:0;background:transparent;color:#dce8e4;display:flex;align-items:center;gap:12px}.oc-nav button.active{color:#5ba8ff}
.oc-menu-pop{position:fixed;z-index:260;background:#0c211a;border:1px solid #ffffff1c;border-radius:17px;box-shadow:0 18px 48px #0009;padding:7px}.oc-menu-pop button{width:100%;height:44px;border:0;background:transparent;color:inherit;text-align:left;padding:0 13px}.oc-tone-pop{position:absolute;right:80px;bottom:62px;width:150px}.oc-more{right:18px;top:70px;width:210px}.oc-long{left:50%;top:50%;transform:translate(-50%,-50%);width:min(260px,calc(100vw - 36px))}.oc-long .danger{color:#ff7f88}.oc-message-more{width:220px}.oc-long-scrim{z-index:240}
.oc-search{position:fixed;z-index:280;inset:0;background:#071b15;padding:max(18px,env(safe-area-inset-top)) 18px calc(18px + var(--oc-safe));box-sizing:border-box}.oc-search-head{display:flex;gap:8px}.oc-search-head input{flex:1;min-width:0;border:1px solid #ffffff18;background:var(--oc-surface);color:inherit;border-radius:16px;padding:11px 13px}.oc-search-result{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:12px}.oc-search-result b,.oc-search-result small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.oc-search-result small{color:var(--oc-muted);margin-top:3px}.oc-search-empty{padding:22px 12px;text-align:center;color:var(--oc-muted)}
.oc-useful{position:fixed;z-index:115;left:50%;bottom:150px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #ffffff18;border-radius:16px;background:#0b2119;font-size:12px}.oc-useful button{border:0;background:transparent;color:inherit}
[hidden]{display:none}
@media(max-width:699px){.oc-tone,.oc-disclaimer,.oc-nav{display:none}}
@media(min-width:700px){body.olen-chat-route .footer{display:none}.oc-chat{padding-left:var(--oc-rail)}.oc-mobile-menu,.oc-scrim{display:none}.oc-sidebar{width:var(--oc-rail);padding:14px 10px}.oc-sidebar.expanded{width:var(--oc-panel);padding:14px 16px}.oc-chat.expanded{padding-left:var(--oc-panel)}.oc-sidebar:not(.expanded) .oc-wordmark,.oc-sidebar:not(.expanded) .oc-side-actions,.oc-sidebar:not(.expanded) .oc-side-row span,.oc-sidebar:not(.expanded) .oc-side-row b,.oc-sidebar:not(.expanded) #ocSections,.oc-sidebar:not(.expanded) .oc-nav span{display:none}.oc-sidebar:not(.expanded) .oc-side-row,.oc-sidebar:not(.expanded) .oc-nav button{width:52px;padding:0;justify-content:center}.oc-stream{width:min(760px,calc(100vw - var(--oc-rail) - 48px));margin:auto;padding-left:0;padding-right:0;padding-bottom:100px}.oc-chat.expanded .oc-stream{width:min(760px,calc(100vw - var(--oc-panel) - 48px))}.oc-compose-zone{left:calc(var(--oc-rail) + (100vw - var(--oc-rail))/2);right:auto;bottom:18px;width:min(760px,calc(100vw - var(--oc-rail) - 48px));transform:translateX(-50%)}.oc-chat.expanded .oc-compose-zone{left:calc(var(--oc-panel) + (100vw - var(--oc-panel))/2);width:min(760px,calc(100vw - var(--oc-panel) - 48px))}.oc-sidebar:not(.expanded) [data-rail-tip]{position:relative;overflow:visible}.oc-sidebar:not(.expanded) [data-rail-tip]:hover:after{content:attr(data-rail-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);z-index:500;width:max-content;padding:7px 10px;border-radius:10px;background:#2b2b2b;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none}}
@media(min-width:700px) and (max-width:1099px){.oc-sidebar.expanded{width:min(var(--oc-panel),42vw)}.oc-chat.expanded{padding-left:min(var(--oc-panel),42vw)}}
@media(min-width:1100px){.oc-stream,.oc-compose-zone{max-width:768px}}
@media(max-height:520px) and (orientation:landscape){.oc-stream{padding-top:58px;padding-bottom:86px}.oc-compose-zone{bottom:calc(8px + var(--oc-safe))}.oc-disclaimer{display:none}}</style></head><body class="olen-chat-route"><section id="ocChat" class="oc-chat" data-clean-chat-v2>
  <header class="oc-header">
    <button id="ocMenu" class="oc-icon oc-mobile-menu" aria-label="Abrir barra lateral"><img src="./assets/olen-sidebar-icon.png" alt=""></button>
    <div class="oc-header-actions">
      <button id="ocNew" class="oc-icon" aria-label="Nova conversa"><svg viewBox="0 0 24 24"><path d="M13.5 5.5 18.5 10.5"/><path d="M4 20l4.1-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/><path d="M13 6H6a2 2 0 0 0-2 2v10"/></svg></button>
      <button id="ocMoreBtn" class="oc-icon" aria-label="Mais opções">⋮</button>
    </div>
  </header>

  <main class="oc-main">
    <div id="ocStream" class="oc-stream" aria-live="polite"></div>
    <div id="ocUseful" class="oc-useful" hidden><span>Esta conversa está a ser útil?</span><button data-useful="up">👍</button><button data-useful="down">👎</button><button data-useful="close">×</button></div>
    <div class="oc-compose-zone">
      <div id="ocFiles" class="oc-files" hidden></div>
      <div class="oc-composer">
        <button id="ocAttach" class="oc-icon" aria-label="Anexar ficheiros">＋</button>
        <input id="ocFile" type="file" multiple accept="image/*,.pdf,.txt,.md,.doc,.docx" hidden>
        <textarea id="ocInput" rows="1" placeholder="Fala com a OLEN…"></textarea>
        <button id="ocTone" class="oc-tone">Equilibrado⌄</button>
        <button id="ocMic" class="oc-icon" aria-label="Ditado"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></svg></button>
        <button id="ocAction" class="oc-action" data-mode="voice" aria-label="Iniciar voz"><span class="oc-voice"><i></i><i></i><i></i></span><img alt="" hidden></button>
      </div>
      <div id="ocToneMenu" class="oc-menu-pop oc-tone-pop" hidden><button data-tone="balanced">Equilibrado</button><button data-tone="direct">Direto</button><button data-tone="explore">Explorar</button></div>
      <div id="ocStatus" class="oc-status" data-state="idle" role="status" hidden></div>
      <div class="oc-disclaimer">A OLEN pode cometer erros. Confirma informações importantes antes de partir.</div>
    </div>
  </main>

  <div id="ocScrim" class="oc-scrim" hidden></div>
  <aside id="ocSidebar" class="oc-sidebar" aria-hidden="true">
    <div class="oc-side-head">
      <button id="ocRail" class="oc-icon oc-rail" data-rail-tip="Abrir barra lateral" aria-label="Expandir ou recolher barra lateral"><img src="./assets/olen-sidebar-icon.png" alt="OLEN"></button>
      <img class="oc-wordmark" src="./assets/olen-wordmark.png" alt="OLEN">
      <div class="oc-side-actions"><button id="ocSearchBtn" class="oc-icon" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button><button id="ocSideCollapse" class="oc-icon" aria-label="Recolher barra lateral">‹</button></div>
    </div>
    <div class="oc-side-scroll">
      <button id="ocSideNew" class="oc-side-row oc-side-new" data-rail-tip="Novo chat"><svg viewBox="0 0 24 24"><path d="M13.5 5.5 18.5 10.5"/><path d="M4 20l4.1-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/><path d="M13 6H6a2 2 0 0 0-2 2v10"/></svg><span>Nova conversa</span></button>
      <div class="oc-tools">
        <button class="oc-side-row" data-tool="images" data-rail-tip="Imagens"><span>▧</span><b>Imagens</b></button>
        <button class="oc-side-row" data-tool="library" data-rail-tip="Biblioteca"><span>▤</span><b>Biblioteca</b></button>
        <button class="oc-side-row" data-tool="plans" data-rail-tip="Projetos / Planos"><span>▱</span><b>Projetos / Planos</b></button>
        <button class="oc-side-row" data-tool="scheduled" data-rail-tip="Agendados"><span>◷</span><b>Agendados</b></button>
      </div>
      <div id="ocSections"></div>
    </div>
    <nav id="ocMainNav" class="oc-nav" aria-label="Navegação principal do Chat">
      <button data-view="home" data-rail-tip="Início"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3Z"/></svg><span>Início</span></button>
      <button data-view="map" data-rail-tip="Mapa"><svg viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15m6-12v15"/></svg><span>Mapa</span></button>
      <button class="active" data-view="chat" data-rail-tip="Chat"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4Z"/></svg><span>Chat</span></button>
      <button data-view="agenda" data-rail-tip="Agenda"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></svg><span>Agenda</span></button>
      <button data-view="profile" data-rail-tip="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 3.6-7 8-7s7 2.5 8 7"/></svg><span>Perfil</span></button>
    </nav>
  </aside>

  <section id="ocSearch" class="oc-search" hidden><div class="oc-search-head"><button id="ocSearchBack" class="oc-icon">←</button><input id="ocSearchInput" placeholder="Pesquisar conversas"></div><p>Pesquisa em todas as conversas</p><div id="ocSearchResults"></div></section>
  <div id="ocLongScrim" class="oc-scrim oc-long-scrim" hidden></div>
  <div id="ocLong" class="oc-menu-pop oc-long" hidden><button data-long="pin">Fixar</button><button data-long="rename">Renomear</button><button data-long="delete" class="danger">Eliminar</button></div>
  <div id="ocMore" class="oc-menu-pop oc-more" hidden><button data-more="share">Partilhar conversa</button><button data-more="conversations">Conversas</button><button data-more="home">Início</button></div>
  <div id="ocMessageMore" class="oc-menu-pop oc-message-more" hidden><button data-message-more="copy">Copiar resposta</button><button data-message-more="share">Partilhar resposta</button><button data-message-more="retry">Gerar novamente</button></div>
</section><script>(()=>{"use strict";
const $=id=>document.getElementById(id),KEY="olen.chat.conversations",ACTIVE="olen.chat.active";let files=[],longId=null,generation=null,recognition=null,messageIndex=null,timer=null;
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}},write=a=>{localStorage.setItem(KEY,JSON.stringify(a));drawSide()},aid=()=>localStorage.getItem(ACTIVE)||read()[0]?.id||"",safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function seed(){let a=read();if(a.length)return;const id="c-"+Date.now();a=[{id,title:"Nova conversa",pinned:false,updated:Date.now(),messages:[{role:"assistant",text:"Olá. O que queres fazer hoje?"}]}];localStorage.setItem(KEY,JSON.stringify(a));localStorage.setItem(ACTIVE,id)}
function current(){seed();return read().find(x=>x.id===aid())||read()[0]}
function navigate(view,detail={}){try{if(window.OLEN5?.router?.enter){window.OLEN5.router.enter(view,detail);return}}catch{}const b=document.querySelector('.nav[data-view="'+view+'"],.nav[data-go="'+view+'"],.desk-nav[data-view="'+view+'"]');if(b)b.click();else window.dispatchEvent(new CustomEvent("olen:navigate",{detail:{view,...detail}}))}
function status(state,text=""){const n=$("ocStatus");n.dataset.state=state;n.textContent=text;n.hidden=!text}
function setActive(id){stop();files=[];drawFiles();localStorage.setItem(ACTIVE,id);drawChat();drawSide();closeSide()}
function msgActions(i,m){const active=m.feedback||"";const icons={copy:"⧉",up:"△",down:"▽",share:"⌯",retry:"↻",more:"•••"};return '<div class="oc-msg-actions" data-index="'+i+'>'+Object.entries(icons).map(([a,v])=>'<button data-act="'+a+'" class="'+(active===a?"active":"")+'" aria-label="'+a+'">'+v+"</button>").join("")+"</div>"}
function drawChat(){const x=current(),out=$("ocStream");out.innerHTML=x.messages.map((m,i)=>{const attach=(m.attachments||[]).map(f=>"\n📎 "+safe(f.name)).join("");if(m.role==="user")return '<div class="oc-user-turn"><div class="oc-bubble">'+safe(m.text)+attach+"</div></div>";const body=m.kind==="card"?'<div class="oc-card" data-card="'+i+'"><small>EXPERIÊNCIA</small><b>'+safe(m.title)+'</b><p>'+safe(m.text)+'</p><button data-card-action="details">Ver detalhes</button><button data-card-action="map">Ver no mapa</button></div>':'<div class="oc-bubble">'+safe(m.text)+"</div>";return '<div class="oc-turn">'+body+msgActions(i,m)+"</div>"}).join("");out.scrollTop=out.scrollHeight;useful(x)}
function useful(x){const n=$("ocUseful"),turns=x.messages.filter(m=>m.role==="user"||m.role==="assistant"&&!m.kind).length;n.hidden=turns<15||turns-Number(x.usefulLastTurn||0)<15}
function section(name,list,limit,all){if(!list.length)return"";return '<div class="oc-section"><div class="oc-section-title">'+name+"</div>"+list.slice(0,limit).map(x=>'<div class="oc-conv-row"><button class="oc-conv '+(x.id===aid()?"active":"")+'" data-conv="'+safe(x.id)+'">'+safe(x.title)+'</button><button class="oc-conv-more" data-conv-more="'+safe(x.id)+'">⋮</button></div>').join("")+(all&&list.length>limit?'<button id="ocRecentAll" class="oc-side-more">Ver todas</button>':"")+"</div>"}
function drawSide(){const a=read(),p=a.filter(x=>x.pinned).sort((a,b)=>b.updated-a.updated),r=a.filter(x=>!x.pinned).sort((a,b)=>b.updated-a.updated),out=$("ocSections");if(!out)return;out.innerHTML=section("Afixados",p,10,false)+section("Recentes",r,5,true);out.querySelectorAll("[data-conv]").forEach(b=>{b.onclick=()=>setActive(b.dataset.conv);b.onpointerdown=e=>{if(e.pointerType!=="mouse")timer=setTimeout(()=>openLong(b.dataset.conv),500)};["pointerup","pointercancel","pointerleave"].forEach(k=>b.addEventListener(k,()=>clearTimeout(timer)))});out.querySelectorAll("[data-conv-more]").forEach(b=>b.onclick=e=>{e.stopPropagation();openLong(b.dataset.convMore)});$("ocRecentAll")?.addEventListener("click",()=>openSearch(true))}
function openSide(){$("ocSidebar").hidden=false;$("ocSidebar").classList.add("expanded");$("ocChat").classList.add("expanded");$("ocSidebar").setAttribute("aria-hidden","false");if(innerWidth<700)$("ocScrim").hidden=false}
function closeSide(){if(innerWidth<700){$("ocSidebar").hidden=true;$("ocSidebar").setAttribute("aria-hidden","true")}else $("ocSidebar").setAttribute("aria-hidden","false");$("ocSidebar").classList.remove("expanded");$("ocChat").classList.remove("expanded");$("ocScrim").hidden=true}
function newConversation(){stop();files=[];drawFiles();const a=read(),id="c-"+Date.now();a.unshift({id,title:"Nova conversa",pinned:false,updated:Date.now(),messages:[{role:"assistant",text:"Olá. O que queres fazer hoje?"}]});write(a);setActive(id)}
function resizeInput(){const n=$("ocInput");n.style.height="auto";n.style.height=Math.min(n.scrollHeight,132)+"px";n.style.overflowY=n.scrollHeight>132?"auto":"hidden";syncAction()}
function syncAction(){const a=$("ocAction"),has=$("ocInput").value.trim()||files.length;if(a.dataset.mode==="stop"){a.querySelector("span").hidden=true;a.querySelector("img").hidden=false;a.querySelector("img").src="./assets/olen-stop-icon.png";$("ocMic").hidden=true;return}a.dataset.mode=has?"send":"voice";a.querySelector("span").hidden=!!has;a.querySelector("img").hidden=!has;if(has)a.querySelector("img").src="./assets/olen-send-msg-icon.png";$("ocMic").hidden=!!has}
function drawFiles(){const n=$("ocFiles");n.hidden=!files.length;n.innerHTML=files.map((f,i)=>'<span class="oc-file">'+safe(f.name)+' <button data-remove="'+i+'">×</button></span>').join("");syncAction()}
function addFiles(list){const seen=new Set(files.map(f=>[f.name,f.size,f.lastModified].join("|")));for(const f of Array.from(list||[])){const k=[f.name,f.size,f.lastModified].join("|");if(files.length<8&&!seen.has(k)){files.push(f);seen.add(k)}}drawFiles();if(files.length>=8)status("limit","Máximo de 8 anexos por mensagem.")}
function prefTone(){try{return JSON.parse(localStorage.getItem("olen.preferences")||"{}").tone||"balanced"}catch{return"balanced"}}
function setTone(v){let p={};try{p=JSON.parse(localStorage.getItem("olen.preferences")||"{}")}catch{}p.tone=v;localStorage.setItem("olen.preferences",JSON.stringify(p));$("ocTone").textContent=({direct:"Direto",explore:"Explorar",balanced:"Equilibrado"}[v]||"Equilibrado")+"⌄"}
function dictate(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){window.dispatchEvent(new CustomEvent("olen:dictation-unavailable"));return}recognition?.stop?.();const r=new SR();recognition=r;r.lang="pt-PT";r.interimResults=true;const base=$("ocInput").value;r.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$("ocInput").value=(base+(base&&t?" ":"")+t).trimStart();resizeInput()};r.onend=()=>{if(recognition===r)recognition=null};r.onerror=r.onend;r.start()}
function stop(){if(!generation)return;generation.abort();generation=null;$("ocAction").dataset.mode="voice";syncAction();status("stopped","Resposta interrompida.");setTimeout(()=>status("idle",""),1400)}
async function engine(id,retryFrom=null){stop();const x=read().find(v=>v.id===id);if(!x)return;const controller=new AbortController();generation=controller;$("ocAction").dataset.mode="stop";syncAction();status("generating","A OLEN está a preparar a resposta…");const detail={conversationId:id,retryFrom,signal:controller.signal,messages:x.messages.map(m=>({role:m.role,content:m.text||"",kind:m.kind||null,attachments:m.attachments||[]})),respond(text,extra={}){if(controller.signal.aborted)return;const a=read(),y=a.find(v=>v.id===id);if(!y)return;y.messages.push({role:"assistant",text:String(text||""),...extra});y.updated=Date.now();write(a);drawChat()},fail(text){if(!controller.signal.aborted)status("error",String(text||"Não foi possível gerar a resposta."))}};window.dispatchEvent(new CustomEvent("olen:conversation-request",{detail}));try{if(typeof window.OLENConversationEngine?.request==="function")await window.OLENConversationEngine.request(detail)}catch(e){detail.fail(e?.message)}finally{if(generation===controller){generation=null;$("ocAction").dataset.mode="voice";syncAction();if($("ocStatus").dataset.state==="generating")status("idle","")}}}
function send(){const input=$("ocInput"),text=input.value.trim();if(!text&&!files.length)return;const a=read(),x=a.find(v=>v.id===aid()),attachments=files.map(f=>({name:f.name,type:f.type||"application/octet-stream",size:f.size,lastModified:f.lastModified}));x.messages.push({role:"user",text:text||attachments.map(f=>"📎 "+f.name).join("\n"),attachments});if(x.title==="Nova conversa")x.title=(text||attachments[0]?.name||"Nova conversa").slice(0,42);x.updated=Date.now();input.value="";files=[];drawFiles();write(a);drawChat();resizeInput();engine(x.id)}
function openLong(id){longId=id;$("ocLong").hidden=false;$("ocLongScrim").hidden=false;const x=read().find(v=>v.id===id),b=$("ocLong").querySelector('[data-long="pin"]');b.textContent=x?.pinned?"Desafixar":"Fixar";b.disabled=!x?.pinned&&read().filter(v=>v.pinned).length>=10}
function closeLong(){$("ocLong").hidden=true;$("ocLongScrim").hidden=true;longId=null}
function results(list,empty){const n=$("ocSearchResults");n.innerHTML=list.map(x=>'<button class="oc-search-result" data-result="'+safe(x.id)+'"><b>'+safe(x.title)+'</b><small>'+safe(x.messages.at(-1)?.text||x.messages.at(-1)?.attachments?.[0]?.name||"")+"</small></button>").join("")||'<div class="oc-search-empty">'+empty+"</div>";n.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>{$("ocSearch").hidden=true;setActive(b.dataset.result)})}
function search(q){q=q.trim().toLowerCase();results(!q?[]:read().filter(x=>x.title.toLowerCase().includes(q)||x.messages.some(m=>String(m.text||"").toLowerCase().includes(q)||(m.attachments||[]).some(f=>String(f.name||"").toLowerCase().includes(q)))),"Nenhuma conversa encontrada.")}
function openSearch(all=false){closeSide();$("ocSearch").hidden=false;$("ocSearchInput").value="";if(all)results(read().sort((a,b)=>b.updated-a.updated),"Sem conversas.");else search("");$("ocSearchInput").focus()}
function shareText(title,text){if(navigator.share)navigator.share({title,text}).catch(()=>{});else navigator.clipboard?.writeText(text)}
function retry(i){const a=read(),x=a.find(v=>v.id===aid());if(!x)return;x.messages.splice(i);x.updated=Date.now();write(a);drawChat();engine(x.id,i)}
function init(){if(!$("ocChat"))return;seed();if(innerWidth<700){$("ocSidebar").hidden=true;$("ocSidebar").setAttribute("aria-hidden","true")}else $("ocSidebar").setAttribute("aria-hidden","false");drawChat();drawSide();resizeInput();setTone(prefTone());
$("ocMenu").onclick=openSide;$("ocRail").onclick=()=>$("ocSidebar").classList.contains("expanded")?closeSide():openSide;$("ocSideCollapse").onclick=closeSide;$("ocScrim").onclick=closeSide;$("ocNew").onclick=$("ocSideNew").onclick=newConversation;
$("ocInput").oninput=resizeInput;$("ocInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("ocAction").onclick=()=>$("ocAction").dataset.mode==="send"?send():$("ocAction").dataset.mode==="stop"?stop():dictate();$("ocMic").onclick=dictate;
$("ocAttach").onclick=()=>$("ocFile").click();$("ocFile").onchange=e=>{addFiles(e.target.files);e.target.value=""};$("ocFiles").onclick=e=>{const b=e.target.closest("[data-remove]");if(b){files.splice(Number(b.dataset.remove),1);drawFiles()}};
$("ocTone").onclick=e=>{e.stopPropagation();$("ocToneMenu").hidden=!$("ocToneMenu").hidden};$("ocToneMenu").onclick=e=>{const b=e.target.closest("[data-tone]");if(b){setTone(b.dataset.tone);$("ocToneMenu").hidden=true}};
$("ocSearchBtn").onclick=()=>openSearch(false);$("ocSearchBack").onclick=()=>$("ocSearch").hidden=true;$("ocSearchInput").oninput=e=>search(e.target.value);
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{const detail={tool:b.dataset.tool,conversationId:aid()};window.dispatchEvent(new CustomEvent("olen:chat-tool",{detail}))});
document.querySelectorAll("#ocMainNav [data-view]").forEach(b=>b.onclick=()=>navigate(b.dataset.view,{reason:"chat-mainnav"}));
$("ocLongScrim").onclick=closeLong;$("ocLong").onclick=e=>{const b=e.target.closest("[data-long]");if(!b||!longId)return;let a=read(),x=a.find(v=>v.id===longId);if(b.dataset.long==="pin")x.pinned=!x.pinned;if(b.dataset.long==="rename"){const n=prompt("Novo nome da conversa",x.title);if(n?.trim())x.title=n.trim()}if(b.dataset.long==="delete"&&confirm("Eliminar esta conversa?")){a=a.filter(v=>v.id!==longId);if(aid()===longId)localStorage.setItem(ACTIVE,a[0]?.id||"")}write(a);closeLong();seed();drawChat()};
$("ocStream").onclick=e=>{const card=e.target.closest("[data-card-action]");if(card){const host=card.closest("[data-card]"),i=Number(host.dataset.card),m=current().messages[i],action=card.dataset.cardAction;window.dispatchEvent(new CustomEvent("olen:chat-card-action",{detail:{conversationId:aid(),messageIndex:i,action,message:m}}));if(action==="map")navigate("map",{reason:"chat-card",item:m});if(action==="details")window.dispatchEvent(new CustomEvent("olen:chat-card-details",{detail:{conversationId:aid(),messageIndex:i,message:m}}));return}const b=e.target.closest("[data-act]");if(!b)return;const i=Number(b.closest("[data-index]").dataset.index),x=current(),m=x.messages[i],act=b.dataset.act;if(act==="copy")navigator.clipboard?.writeText(m.text||"");if(act==="share")shareText(x.title,m.text||"");if(act==="retry")retry(i);if(act==="up"||act==="down"){const a=read(),y=a.find(v=>v.id===x.id);y.messages[i].feedback=y.messages[i].feedback===act?"":act;y.updated=Date.now();write(a);drawChat()}if(act==="more"){messageIndex=i;$("ocMessageMore").hidden=false;const r=b.getBoundingClientRect();$("ocMessageMore").style.left=Math.max(12,Math.min(r.left,innerWidth-232))+"px";$("ocMessageMore").style.top=Math.max(12,Math.min(r.bottom+4,innerHeight-160))+"px"}};
$("ocMessageMore").onclick=e=>{const b=e.target.closest("[data-message-more]");if(!b||messageIndex===null)return;const x=current(),m=x.messages[messageIndex],act=b.dataset.messageMore;if(act==="copy")navigator.clipboard?.writeText(m.text||"");if(act==="share")shareText(x.title,m.text||"");if(act==="retry")retry(messageIndex);$("ocMessageMore").hidden=true;messageIndex=null};
$("ocUseful").onclick=e=>{const b=e.target.closest("[data-useful]");if(!b)return;const a=read(),x=a.find(v=>v.id===aid()),turns=x.messages.filter(m=>m.role==="user"||m.role==="assistant"&&!m.kind).length;x.usefulLastTurn=turns;if(b.dataset.useful!=="close")x.usefulRating=b.dataset.useful;x.updated=Date.now();write(a);useful(x)};
$("ocMoreBtn").onclick=e=>{e.stopPropagation();$("ocMore").hidden=!$("ocMore").hidden};$("ocMore").onclick=e=>{const b=e.target.closest("[data-more]");if(!b)return;$("ocMore").hidden=true;const x=current();if(b.dataset.more==="conversations")openSide();if(b.dataset.more==="home")navigate("home",{reason:"chat-more"});if(b.dataset.more==="share")shareText(x.title,x.messages.map(m=>(m.role==="user"?"Eu: ":"OLEN: ")+(m.text||"")).join("\n\n"))};
document.addEventListener("click",e=>{if(!e.target.closest("#ocTone")&&!e.target.closest("#ocToneMenu"))$("ocToneMenu").hidden=true;if(!e.target.closest("#ocMoreBtn")&&!e.target.closest("#ocMore"))$("ocMore").hidden=true;if(!e.target.closest("[data-act=more]")&&!e.target.closest("#ocMessageMore"))$("ocMessageMore").hidden=true});
window.addEventListener("resize",()=>{if(innerWidth<700){$("ocSidebar").hidden=true;$("ocSidebar").classList.remove("expanded");$("ocSidebar").setAttribute("aria-hidden","true");$("ocChat").classList.remove("expanded")}else{$("ocSidebar").hidden=false;$("ocSidebar").setAttribute("aria-hidden","false")}});
window.OLENChatClean={version:"2.0.0-clean-v2",render:drawChat,newConversation,openSidebar:openSide,closeSidebar:closeSide,send,requestEngine:engine,stopGeneration:stop}}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init()})();</script></body></html>
