<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLEN Chat Clean V4</title>
<style>
:root{--safe:env(safe-area-inset-bottom);--rail:72px;--panel:340px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020806;color:#eef7f4;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.chat{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 5%,#0a2b20 0,transparent 28%),linear-gradient(#04120e,#020806)}
.top{position:absolute;z-index:20;top:18px;left:18px;right:18px;max-width:560px;margin:auto;height:44px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.top button{pointer-events:auto;border:0;background:transparent;color:#fff}.menu{width:41px;height:44px;font-size:22px}.top-actions{display:flex;width:68px;height:44px;justify-content:flex-end}.top-actions button{width:34px;height:44px;padding:0;display:grid;place-items:center}.top-actions svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.body{height:calc(100dvh - 94px - var(--safe))}.messages{height:100%;overflow:auto;scrollbar-width:none;padding:66px 0 82px;display:flex;flex-direction:column;gap:8px}.messages::-webkit-scrollbar,.side-scroll::-webkit-scrollbar{display:none}.bubble{align-self:flex-start;max-width:82%;padding:14px 16px;border:1px solid rgba(91,168,255,.42);background:rgba(4,22,19,.16);border-radius:18px 18px 18px 6px;box-shadow:inset 2px 0 rgba(177,108,255,.22)}.bubble.me{align-self:flex-end;background:rgba(91,168,255,.20);border-color:rgba(82,246,220,.52);border-radius:18px 18px 6px 18px;box-shadow:none}.assistant{align-self:flex-start;max-width:82%;display:flex;flex-direction:column;gap:4px}.assistant>.bubble{max-width:100%}.msg-actions{height:34px;display:flex;gap:2px;padding-left:3px}.msg-actions button{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#9eaaa6}
.useful{align-self:stretch;margin:10px 0 12px;min-height:48px;border:1px solid #ffffff33;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding-left:16px;color:#b8c5c1;font-size:13px}.useful-actions{align-self:stretch;display:flex}.useful button{border:0;background:transparent;color:#aebdb8;padding:0 12px}
.composer-wrap{position:fixed;z-index:120}.composer{width:100%;min-height:54px;padding:5px 8px;gap:5px;border-radius:27px;background:#16251e;display:flex;align-items:center}.composer textarea{flex:1;min-width:0;min-height:42px;max-height:112px;padding:10px 7px;border:0;outline:0;resize:none;background:transparent;color:inherit;line-height:20px}.composer button{border:0;background:transparent;color:#dcebe6}.plus,.mic{width:34px;height:34px;flex:0 0 34px;padding:0;display:grid;place-items:center}.plus{font-size:24px;font-weight:300}.tone{height:34px;display:flex;align-items:center;gap:5px;padding:0 5px;color:#aebdb8;font-size:12px}.action{width:38px;height:38px;flex:0 0 38px;padding:0;border-radius:50%;display:grid;place-items:center}.action img{width:38px;height:38px}.disclaimer{text-align:center;color:#81918c;font-size:9px;margin-top:4px}.tone-menu{position:absolute;right:82px;bottom:62px;z-index:260;width:150px;padding:6px;background:#0b2119;border:1px solid #ffffff18;border-radius:14px;box-shadow:0 14px 38px #0008}.tone-menu button{width:100%;height:40px;border:0;border-radius:9px;background:transparent;color:#eaf4f1;text-align:left;padding:0 10px}.voice-glyph{font-size:11px;letter-spacing:1px;color:#52f6dc}
.scrim,.long-scrim{position:fixed;inset:0;background:#020a0db8;backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.18s;z-index:190}.sidebar{position:fixed;z-index:200;inset:0 auto 0 0;width:min(86vw,360px);padding:calc(18px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#071b15,#06130f);border-right:1px solid #ffffff12;box-shadow:18px 0 60px #0008;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column}.sidebar.open{transform:none}.side-head{height:58px;display:flex;align-items:center;gap:10px}.rail-brand{display:none}.wordmark{width:96px;height:auto;margin-right:auto}.head-actions{display:flex;align-items:center;gap:4px}.head-actions button{width:40px;height:40px;padding:0;border:0;background:transparent;color:#eef7f4;display:grid;place-items:center}.head-actions svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}.collapse{display:none}.side-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:none}.side-new,.tools button{width:100%;height:54px;border:0;border-radius:12px;background:transparent;color:#eef7f4;text-align:left;padding:0 14px;display:flex;align-items:center;gap:15px;font-size:16px;font-weight:750}.side-new svg,.tools svg{width:25px;height:25px;fill:none;stroke:#e8f3ef;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.side-new span,.tools span{width:27px;height:27px;display:grid;place-items:center}.tools{margin-bottom:5px}.section{padding:12px 0;border-top:1px solid #ffffff1a}.section-title{padding:0 8px 7px;color:#91a19b;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.conv-row{border-radius:12px}.conv{touch-action:pan-y;-webkit-touch-callout:none;user-select:none;width:100%;height:46px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:#eaf3f0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:650}.conv-more{display:none}.side-more{width:100%;height:42px;border:0;background:transparent;color:#63ddb1;text-align:left;padding:0 12px;font-weight:750}.mainnav{display:none}
.search{position:fixed;inset:0;z-index:300;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#07161a,#081b1f);color:#edf6f3}.search-head{display:flex;align-items:center;gap:12px}.search-back{width:42px;height:42px;flex:0 0 42px;padding:0;border:1px solid #ffffff1c;border-radius:50%;background:#102820;color:#fff;display:grid;place-items:center}.search-back svg{width:22px;height:22px;fill:none;stroke:#f1f8f5;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.search input{height:52px;flex:1;min-width:0;border:1.5px solid #4de0aa;border-radius:28px;background:#102027;color:#fff;padding:0 20px;font-size:18px;outline:0}.search>p{color:#8fa19b;font-size:14px;margin:18px 4px}.results{overflow:auto;max-height:calc(100vh - 150px)}.result{width:100%;border:0;border-bottom:1px solid #ffffff0d;background:transparent;color:#eef6f3;text-align:left;padding:14px 8px}.hint{color:#82948e;text-align:center;margin-top:58px;font-size:17px}
.more{position:fixed;right:18px;top:78px;z-index:230;width:210px;padding:7px;background:#0c211a;border:1px solid #ffffff1c;border-radius:17px;box-shadow:0 18px 48px #0009}.more button,.long-menu button{width:100%;border:0;background:transparent;color:#edf7f3;text-align:left}.more button{height:46px;padding:0 13px;border-radius:11px;font-weight:650}.long-scrim{z-index:240}.long-menu{position:fixed;z-index:241;left:50%;top:50%;transform:translate(-50%,-50%);width:min(260px,calc(100vw - 36px));padding:8px;background:#0c211a;border:1px solid #63ddb133;border-radius:20px;box-shadow:0 20px 54px #000a}.long-menu button{height:52px;padding:0 15px;border-radius:13px;font-weight:700}.long-menu .danger{color:#ff7f88;border-top:1px solid #ffffff10}[hidden]{display:none}
@media(max-width:699px){.tone,.mainnav{display:none}.composer-wrap{left:10px;right:10px;bottom:calc(58px + var(--safe));transform:translateY(-29px)}.disclaimer{display:none}}
@media(min-width:700px){.chat{padding-left:var(--rail);transition:padding-left .22s}.chat.side-open{padding-left:var(--panel)}.top{position:fixed;left:calc(var(--rail) + 18px);max-width:none}.chat.side-open .top{left:calc(var(--panel) + 18px)}.menu{display:none}.sidebar{width:var(--rail);transform:none;padding:14px 10px;box-shadow:none}.sidebar.open{width:var(--panel);padding:14px 16px}.sidebar:not(.open) .wordmark,.sidebar:not(.open) .head-actions,.sidebar:not(.open) .side-scroll{display:none}.sidebar:not(.open) .rail-brand{display:block;width:46px;height:46px}.sidebar.open .collapse{display:grid}.sidebar.open .conv-row{display:flex;align-items:center}.sidebar.open .conv{flex:1;min-width:0;width:auto;padding-right:4px}.sidebar.open .conv-more{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;margin-right:4px;padding:0;border:0;border-radius:9px;background:transparent;color:#dce8e4;font-size:22px;opacity:.72}.composer-wrap{bottom:18px;width:min(760px,calc(100vw - var(--rail) - 48px));left:calc(var(--rail) + (100vw - var(--rail))/2);transform:translateX(-50%)}.chat.side-open .composer-wrap{width:min(760px,calc(100vw - var(--panel) - 48px));left:calc(var(--panel) + (100vw - var(--panel))/2)}.mainnav{display:block}}
@media(min-width:700px) and (hover:hover){button,.conv,.result{cursor:pointer}.sidebar.open .conv-row:hover{background:#ffffff0e}.sidebar.open .conv-more:hover,.msg-actions button:hover,.more button:hover,.long-menu button:hover{background:#ffffff17}.sidebar.open .conv-row:hover .conv-more{opacity:1}}
</style></head>
<body><main class="chat" id="olenChat">
<header class="top"><button class="menu" id="olenChatMenuBtn" aria-label="Conversas">☰</button><div></div><div class="top-actions"><button id="olenNewChatBtn" aria-label="Nova conversa"><svg viewBox="0 0 24 24"><path d="M5.5 3.5H4.75A2.75 2.75 0 0 0 2 6.25v13A2.75 2.75 0 0 0 4.75 22h13A2.75 2.75 0 0 0 20.5 19.25V18"/><path d="M8 16l1.2-4.4 8.45-8.45a2.15 2.15 0 0 1 3.05 3.05l-8.45 8.45L8 16Z"/><path d="m15.9 4.9 3.2 3.2"/></svg></button><button id="olenChatMoreBtn" aria-label="Mais">⋮</button></div></header>
<section class="body" id="olenChatBody"><div class="messages" id="olenChatMessages"></div><div class="useful" id="olenChatUseful" hidden><span>Esta conversa foi útil até agora?</span><div class="useful-actions"><button data-useful="up" aria-label="Sim">♡</button><button data-useful="down" aria-label="Não">♧</button><button data-useful="close" aria-label="Fechar">×</button></div></div></section>
<div class="composer-wrap"><div class="composer"><button class="plus" id="olenChatAttach">+</button><textarea id="olenChatInput" rows="1" placeholder="Fala com a OLEN…"></textarea><button class="tone" id="olenToneTrigger"><span id="olenToneLabel">Equilibrado</span><span>⌄</span></button><button class="mic" id="olenChatMic">⌁</button><button class="action" id="olenChatAction" aria-label="Iniciar voz"><img src="../assets/olen-send-msg-icon.png" alt="" hidden><span class="voice-glyph">|||</span></button></div><div class="tone-menu" id="olenToneMenu" hidden><button data-tone="direct">Direto</button><button data-tone="balanced">Equilibrado</button><button data-tone="explore">Explorar</button></div><div class="disclaimer">A OLEN pode cometer erros. Confirma informações importantes antes de partir.</div></div>
<div class="scrim" id="olenChatScrim"></div><aside class="sidebar" id="olenChatSidebar" aria-hidden="true"><div class="side-head"><button id="olenRailToggle" style="border:0;background:transparent;padding:0"><img class="rail-brand" src="../assets/olen-sidebar-icon.png" alt="OLEN"></button><img class="wordmark" src="../assets/olen-wordmark.png" alt="OLEN"><div class="head-actions"><button id="olenChatSearchBtn" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button><button class="collapse" id="olenSideCollapse" aria-label="Fechar">▯</button></div></div><div class="side-scroll"><button class="side-new" id="olenSideNew"><span><svg viewBox="0 0 24 24"><path d="M5.5 3.5H4.75A2.75 2.75 0 0 0 2 6.25v13A2.75 2.75 0 0 0 4.75 22h13A2.75 2.75 0 0 0 20.5 19.25V18"/><path d="M8 16l1.2-4.4 8.45-8.45a2.15 2.15 0 0 1 3.05 3.05l-8.45 8.45L8 16Z"/><path d="m15.9 4.9 3.2 3.2"/></svg></span>Nova conversa</button><div class="tools"><button><span>⌘</span>Ferramentas</button></div><div id="olenSideSections"></div></div></aside>
<section class="search" id="olenChatSearchPop" hidden><div class="search-head"><button class="search-back" id="olenSearchBack"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button><input id="olenSearchInput" placeholder="Pesquisar conversas"></div><p>Pesquisa nas tuas conversas</p><div class="results" id="olenSearchResults"></div></section>
<div class="more" id="olenChatMore" hidden><button data-more="conversations">Conversas</button><button data-more="share">Partilhar</button><button data-more="home">Ir para Início</button></div>
<div class="long-scrim" id="olenLongScrim" hidden></div><div class="long-menu" id="olenLongMenu" hidden><button data-long="pin">Fixar / Desafixar</button><button data-long="rename">Renomear</button><button class="danger" data-long="delete">Eliminar</button></div>
</main><script src="./clean-v4.js"></script></body></html>
