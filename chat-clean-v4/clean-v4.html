<body><main class="chat" id="olenChat">

ata-rail-tip="Mapa"><svg viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15m6-12v15"/></svg><span>Mapa</span></button><button class="active" data-view="chat" data-rail-tip="Chat"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4Z"/></svg><span>Chat</span></button><button data-view="agenda" data-rail-tip="Agenda"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></svg><span>Agenda</span></button><button data-view="profile" data-rail-tip="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 3.6-7 8-7s7 2.5 8 7"/></svg><span>Perfil</span></button></nav></aside>
